name: VBA source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py --check
      - run: python -m unittest discover -s tools -p 'test_source_checks.py' -v
      - run: python -m unittest discover -s tools -p 'test_vba_lint.py' -v
      - run: python -m unittest discover -s tools -p 'test_karma_model.py' -v
      - name: LibreOffice Basic compile smoke test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc python3-uno > /dev/null
          /usr/bin/python3 tools/lo_compile.py
      - run: python -m compileall -q tools
